<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">From sensor assumptions to engineering decisions</title><desc id="desc">Antenna data and scan presets enter the link-budget model, exposed through a Dash interface. The modeled results support production test limits and customer coverage maps.</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#202948" stroke-width="1" opacity=".45" /></pattern><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#7cc6ff" stroke-width="1.4" /></marker></defs><rect width="960" height="560" fill="#0d1228" /><rect width="960" height="560" fill="url(#grid)" /><style>text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;fill:#e9edf7;font-size:18px}.label{font-size:13px;letter-spacing:2px;fill:#8d9cbe}.title{font-size:28px;font-weight:600}.muted{fill:#a6b4d0;font-size:15px}.gold{fill:#f2c76d}.blue{fill:#7cc6ff}.box{fill:#141e37;stroke:#3a4f76;stroke-width:1.5}.flow{fill:none;stroke:#7cc6ff;stroke-width:2;marker-end:url(#arrow)}</style><text x="44" y="45" class="label">PYSCOTT / SYSTEM OVERVIEW</text><text x="44" y="85" class="title">From sensor assumptions to engineering decisions</text><rect class="box" x="44" y="153" width="250" height="116" rx="8" /><text x="62" y="187" class="" style="font-size:16.7px">Antenna + scan preset</text><text x="62" y="212" class="muted">Simulated or measured</text><text x="62" y="237" class="muted">Sensor configuration</text><rect class="box" x="354" y="153" width="250" height="116" rx="8" /><text x="372" y="187" class="gold" style="font-size:14.6px">Python link-budget model</text><text x="372" y="212" class="muted">Waveform + DSP</text><text x="372" y="237" class="muted">Theoretical SNR</text><rect class="box" x="664" y="153" width="252" height="116" rx="8" /><text x="682" y="187" class="">Dash interface</text><text x="682" y="212" class="muted">Explore configurations</text><text x="682" y="237" class="muted">Export plots + tables</text><path class="flow" d="M294 210h49" /><path class="flow" d="M604 210h49" /><rect class="box" x="44" y="335" width="395" height="112" rx="8" /><text x="62" y="369" class="">Production test limits</text><text x="62" y="394" class="muted">Model-derived SNR thresholds</text><rect class="box" x="521" y="335" width="395" height="112" rx="8" /><text x="539" y="369" class="">Customer coverage maps</text><text x="539" y="394" class="muted">Range · Doppler · angle</text><path class="flow" d="M479 269v35H240v20" /><path class="flow" d="M479 304h240v20" /><text x="44" y="531" class="label">HAMZA IQBAL / PROJECT NOTES</text></svg>