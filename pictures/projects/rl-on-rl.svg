<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Learning to play, then learning to improve</title><desc id="desc">Replay states produce teacher labels for behavior cloning, followed by PPO self-play with a competence-gated curriculum and matched checkpoint evaluation.</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#202948" stroke-width="1" opacity=".45" /></pattern><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#7cc6ff" stroke-width="1.4" /></marker></defs><rect width="960" height="560" fill="#0d1228" /><rect width="960" height="560" fill="url(#grid)" /><style>text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;fill:#e9edf7;font-size:18px}.label{font-size:13px;letter-spacing:2px;fill:#8d9cbe}.title{font-size:28px;font-weight:600}.muted{fill:#a6b4d0;font-size:15px}.gold{fill:#f2c76d}.blue{fill:#7cc6ff}.box{fill:#141e37;stroke:#3a4f76;stroke-width:1.5}.flow{fill:none;stroke:#7cc6ff;stroke-width:2;marker-end:url(#arrow)}</style><text x="44" y="45" class="label">RL RESEARCH / PIPELINE OVERVIEW</text><text x="44" y="85" class="title">Learning to play, then learning to improve</text><rect class="box" x="44" y="154" width="194" height="95" rx="8" /><text x="62" y="188" class="gold">Replay states</text><text x="62" y="213" class="muted">Demonstrations</text><rect class="box" x="270" y="154" width="194" height="95" rx="8" /><text x="288" y="188" class="">Teacher labels</text><text x="288" y="213" class="muted">Action targets</text><rect class="box" x="496" y="154" width="194" height="95" rx="8" /><text x="514" y="188" class="" style="font-size:16.2px">Behavior cloning</text><text x="514" y="213" class="muted">Initial policy</text><rect class="box" x="722" y="154" width="194" height="95" rx="8" /><text x="740" y="188" class="gold">PPO self-play</text><text x="740" y="213" class="muted">Policy updates</text><path class="flow" d="M238 201h25" /><path class="flow" d="M464 201h25" /><path class="flow" d="M690 201h25" /><rect class="box" x="44" y="331" width="330" height="111" rx="8" /><text x="62" y="365" class="" style="font-size:17.9px">Competence-gated curriculum</text><text x="62" y="390" class="muted">Progress when the policy</text><text x="62" y="415" class="muted">meets the stage criteria</text><rect class="box" x="496" y="331" width="420" height="111" rx="8" /><text x="514" y="365" class="gold">Matched checkpoint evaluation</text><text x="514" y="390" class="muted">Compare guidance on / off</text><text x="514" y="415" class="muted">Inspect behavior, not just reward</text><path class="flow" d="M374 384h48V278h397v-21" /><path class="flow" d="M819 249v70" /><text x="44" y="531" class="label">HAMZA IQBAL / PROJECT NOTES</text></svg>