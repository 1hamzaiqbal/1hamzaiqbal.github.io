<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Separate better evidence from better answers</title><desc id="desc">Controlled evidence conditions feed the same reader, and the evaluation tracks answer quality, retrieval metrics and inference cost.</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#202948" stroke-width="1" opacity=".45" /></pattern><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#7cc6ff" stroke-width="1.4" /></marker></defs><rect width="960" height="560" fill="#0d1228" /><rect width="960" height="560" fill="url(#grid)" /><style>text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;fill:#e9edf7;font-size:18px}.label{font-size:13px;letter-spacing:2px;fill:#8d9cbe}.title{font-size:28px;font-weight:600}.muted{fill:#a6b4d0;font-size:15px}.gold{fill:#f2c76d}.blue{fill:#7cc6ff}.box{fill:#141e37;stroke:#3a4f76;stroke-width:1.5}.flow{fill:none;stroke:#7cc6ff;stroke-width:2;marker-end:url(#arrow)}</style><text x="44" y="45" class="label">RAG EVALUATION / CONTROLLED COMPARISONS</text><text x="44" y="85" class="title">Separate better evidence from better answers</text><rect class="box" x="44" y="152" width="210" height="118" rx="8" /><text x="62" y="186" class="" style="font-size:16.8px">Question + reader</text><text x="62" y="211" class="muted">Legal or general QA</text><text x="62" y="236" class="muted" style="font-size:14.3px">Fixed evaluation set</text><rect class="box" x="304" y="129" width="305" height="72" rx="8" /><text x="322" y="163" class="">No evidence / retrieved</text><rect class="box" x="304" y="218" width="305" height="72" rx="8" /><text x="322" y="252" class="">Gold / reranked evidence</text><rect class="box" x="659" y="173" width="257" height="110" rx="8" /><text x="677" y="207" class="gold">Answer generation</text><text x="677" y="232" class="muted">Matched reader</text><text x="677" y="257" class="muted">Same questions</text><path class="flow" d="M254 208h23v-43h18" /><path class="flow" d="M277 208v46h18" /><path class="flow" d="M609 165h22v50h19" /><path class="flow" d="M609 254h22v-25h19" /><rect class="box" x="304" y="365" width="612" height="96" rx="8" /><text x="322" y="399" class="">Evaluate the whole system</text><text x="322" y="424" class="muted">Answer quality · retrieval quality · calls / tokens / latency</text><path class="flow" d="M787 283v71" /><text x="44" y="398" class="gold">Where did</text><text x="44" y="425" class="gold">retrieval help?</text><text x="44" y="531" class="label">HAMZA IQBAL / PROJECT NOTES</text></svg>