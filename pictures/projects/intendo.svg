<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">A deliberate loop from goals to daily action</title><desc id="desc">Goals guide fresh daily intentions. Actual outcomes inform reflection, and unfinished intentions carry forward only through a deliberate choice.</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#202948" stroke-width="1" opacity=".45" /></pattern><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#7cc6ff" stroke-width="1.4" /></marker></defs><rect width="960" height="560" fill="#0d1228" /><rect width="960" height="560" fill="url(#grid)" /><style>text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;fill:#e9edf7;font-size:18px}.label{font-size:13px;letter-spacing:2px;fill:#8d9cbe}.title{font-size:28px;font-weight:600}.muted{fill:#a6b4d0;font-size:15px}.gold{fill:#f2c76d}.blue{fill:#7cc6ff}.box{fill:#141e37;stroke:#3a4f76;stroke-width:1.5}.flow{fill:none;stroke:#7cc6ff;stroke-width:2;marker-end:url(#arrow)}</style><text x="44" y="45" class="label">INTENDO / PRODUCT WORKFLOW</text><text x="44" y="85" class="title">A deliberate loop from goals to daily action</text><rect class="box" x="44" y="155" width="250" height="105" rx="8" /><text x="62" y="189" class="gold">Goals</text><text x="62" y="214" class="muted">Choose what matters</text><rect class="box" x="354" y="155" width="250" height="105" rx="8" /><text x="372" y="189" class="">Daily intentions</text><text x="372" y="214" class="muted">Choose today’s actions</text><rect class="box" x="664" y="155" width="252" height="105" rx="8" /><text x="682" y="189" class="">Actual outcomes</text><text x="682" y="214" class="muted">Record what happened</text><path class="flow" d="M294 207h48" /><path class="flow" d="M604 207h48" /><rect class="box" x="514" y="346" width="402" height="105" rx="8" /><text x="532" y="380" class="gold">Reflection</text><text x="532" y="405" class="muted">Enough / Not enough / Day off</text><rect class="box" x="44" y="346" width="402" height="105" rx="8" /><text x="62" y="380" class="">Fresh choices tomorrow</text><text x="62" y="405" class="muted">Carry forward deliberately</text><path class="flow" d="M790 260v75" /><path class="flow" d="M514 399h-56" /><path class="flow" d="M169 346v-70" /><text x="44" y="531" class="label">HAMZA IQBAL / PROJECT NOTES</text></svg>