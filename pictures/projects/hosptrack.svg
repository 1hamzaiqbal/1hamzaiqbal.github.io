<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">A spatial interface for hospital workflows</title><desc id="desc">A schematic synthetic ward connects to a patient chart and AI briefing. Natural-language commands map to structured interface navigation.</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#202948" stroke-width="1" opacity=".45" /></pattern><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#7cc6ff" stroke-width="1.4" /></marker></defs><rect width="960" height="560" fill="#0d1228" /><rect width="960" height="560" fill="url(#grid)" /><style>text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;fill:#e9edf7;font-size:18px}.label{font-size:13px;letter-spacing:2px;fill:#8d9cbe}.title{font-size:28px;font-weight:600}.muted{fill:#a6b4d0;font-size:15px}.gold{fill:#f2c76d}.blue{fill:#7cc6ff}.box{fill:#141e37;stroke:#3a4f76;stroke-width:1.5}.flow{fill:none;stroke:#7cc6ff;stroke-width:2;marker-end:url(#arrow)}</style><text x="44" y="45" class="label">HOSPTRACK / SYNTHETIC UI SCHEMATIC</text><text x="44" y="85" class="title">A spatial interface for hospital workflows</text><rect class="box" x="44" y="141" width="500" height="326" rx="8" /><text x="62" y="175" class="">Spatial overview</text><text x="62" y="200" class="muted">Synthetic ward layout</text><rect x="67" y="238" width="127" height="76" rx="5" fill="#202c48" stroke="#465a7f" /><circle cx="90" cy="267" r="7" fill="#8099bd" /><text x="84" y="295" class="muted">ROOM 1</text><rect x="216" y="238" width="127" height="76" rx="5" fill="#202c48" stroke="#465a7f" /><circle cx="239" cy="267" r="7" fill="#8099bd" /><text x="233" y="295" class="muted">ROOM 2</text><rect x="365" y="238" width="127" height="76" rx="5" fill="#202c48" stroke="#465a7f" /><circle cx="388" cy="267" r="7" fill="#8099bd" /><text x="382" y="295" class="muted">ROOM 3</text><rect x="67" y="336" width="127" height="76" rx="5" fill="#202c48" stroke="#465a7f" /><circle cx="90" cy="365" r="7" fill="#8099bd" /><text x="84" y="393" class="muted">ROOM 4</text><rect x="216" y="336" width="127" height="76" rx="5" fill="#173c50" stroke="#7cc6ff" /><circle cx="239" cy="365" r="7" fill="#f2c76d" /><text x="233" y="393" class="muted">ROOM 5</text><rect x="365" y="336" width="127" height="76" rx="5" fill="#202c48" stroke="#465a7f" /><circle cx="388" cy="365" r="7" fill="#8099bd" /><text x="382" y="393" class="muted">ROOM 6</text><rect class="box" x="596" y="141" width="320" height="146" rx="8" /><text x="614" y="175" class="gold">Selected patient</text><text x="614" y="200" class="muted">Synthetic chart</text><text x="614" y="225" class="muted">AI-generated briefing</text><path class="flow" d="M544 249h40" /><rect class="box" x="596" y="338" width="320" height="129" rx="8" /><text x="614" y="372" class="">Natural-language command</text><text x="614" y="397" class="muted">Parse → structured action</text><text x="614" y="422" class="muted">Navigate the interface</text><path class="flow" d="M596 400h-40" /><text x="44" y="531" class="label">HAMZA IQBAL / PROJECT NOTES</text></svg>